$("mn").onclick=()=>document.body.classList.toggle("open");$("bd").onclick=cl;
function pick(j){const q=set[i];if(res||st[q.id]!=null)return;st[q.id]=j;if(j==q.a){sk++;bk=Math.max(bk,sk)}else sk=0;sv();show()}
function stats(){const d=set.filter(q=>st[q.id]!=null).length,r=set.filter(q=>st[q.id]==q.a).length;return{d,r,n:set.length}}
function tm(){const s=Math.floor((Date.now()-t0)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function show(){chips();const nav=$("nav");
if(!set.length){$("card").innerHTML='<div class="c"><div class="big">🎉</div>Nothing here yet.</div>';nav.style.display="none";$("pos").textContent="";$("sc").textContent="";$("pb").style.width=0;return}
const {d,r,n}=stats();$("pb").style.width=d/n*100+"%";$("sc").innerHTML=`✔ ${r}/${d} · 🔥 ${sk}`;
if(res){nav.style.display="none";$("pos").textContent="Results";return results(r,n)}
nav.style.display="flex";const q=set[i],s=st[q.id];$("pos").textContent=`Question ${i+1}/${n}`;
$("card").innerHTML=`<button class="fl ${fl[q.id]?'on':''}" id="fl" title="Flag">⭐</button><div class="tag">${q.k} · #${q.n}</div><p class="q">${q.q}</p>`+
q.o.map((t,j)=>{let c="";if(s!=null){c="lk "+(j==q.a?"ok":j==s?"no":"")}
return`<div class="o ${c}" data-j="${j}"><b>${L[j]}</b><span>${t}</span></div>`}).join("")+
`<div class="fb">${s==null?"":s==q.a?(sk>=3?"✅ Correct! 🔥 "+sk+" in a row":"✅ Correct!"):"❌ Wrong — correct answer is "+L[q.a]}</div>`;
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(String(getSelection()).length)return;pick(+b.dataset.j)});
$("fl").onclick=()=>{fl[q.id]=!fl[q.id];sv();show()};
$("next").textContent=i==n-1?"Finish ✓":"Next →";$("prev").style.visibility=i?"visible":"hidden"}
function results(r,n){const w=set.filter(q=>st[q.id]!=null&&st[q.id]!=q.a),p=Math.round(r/n*100);
const m=p>=90?"🏆 Outstanding!":p>=75?"🎉 Great job!":p>=50?"👍 Getting there":"📚 Keep studying";
const ki=keys.indexOf(cur);
$("card").innerHTML=`<div class="c"><div class="big">${m.split(" ")[0]}</div><h2 style="margin:0">${p}%</h2><div>${m.slice(3)}</div></div>
<div class="st2"><div><b>${r}/${n}</b>correct</div><div><b>${w.length}</b>wrong</div><div><b>${bk}</b>best streak</div></div>
<div class="row">${w.length?'<button class="btn p" id="rw">🔁 Retry wrong only</button>':''}<button class="btn" id="rs">↺ Restart</button>${ki>=0&&ki<keys.length-1?'<button class="btn" id="ns">Next section →</button>':''}</div>
${w.length?'<h3>Review your mistakes</h3>'+w.map(q=>`<div class="rv"><b>${q.q}</b><div class="y">✗ You: ${L[st[q.id]]}. ${q.o[st[q.id]]}</div><div class="g">✓ ${L[q.a]}. ${q.o[q.a]}</div></div>`).join(""):'<p class="c">Perfect — nothing to review! 🌟</p>'}`;
if($("rw"))$("rw").onclick=()=>{set=w;set.forEach(q=>delete st[q.id]);sv();i=0;res=false;sk=0;bk=0;t0=Date.now();show()};
$("rs").onclick=()=>{set.forEach(q=>delete st[q.id]);sv();build();show()};
if($("ns"))$("ns").onclick=()=>go(keys[ki+1])}
function nxt(){if(res)return;if(i<set.length-1)i++;else{const u=set.findIndex(q=>st[q.id]==null);if(u>=0)i=u;else res=true}show()}
function prv(){if(i>0&&!res){i--;show()}}
$("next").onclick=nxt;$("prev").onclick=prv;
document.addEventListener("keydown",e=>{const k=e.key.toUpperCase();if("ABCDE".includes(k)&&k.length==1)pick(L.indexOf(k));else if("12345".includes(k)&&k.length==1)pick(+k-1);
else if(e.key=="ArrowRight"||e.key=="Enter")nxt();else if(e.key=="ArrowLeft")prv();else if(k=="F"&&set[i]&&!res){fl[set[i].id]=!fl[set[i].id];sv();show()}});
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t=="dark"?"☀️":"🌙";try{localStorage.setItem("q_th",t)}catch(e){}}
let t0th=null;try{t0th=localStorage.getItem("q_th")}catch(e){}
theme(t0th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>theme(document.documentElement.dataset.theme=="dark"?"light":"dark");
$("shf").onclick=()=>{sh=!sh;$("shf").classList.toggle("on",sh);build();show()};
$("rst").onclick=()=>{if(confirm("Reset all answers and flags?")){st={};fl={};sv();build();show()}};
build();show();
</script></body></html>
